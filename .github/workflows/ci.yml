name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ПетрухинОИ/requirements.txt

      - name: Install dependencies
        working-directory: ./ПетрухинОИ
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Build project
        working-directory: ./ПетрухинОИ
        run: python -m build

      - name: Run tests
        working-directory: ./ПетрухинОИ
        run: pytest -v